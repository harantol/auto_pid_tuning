# Every merge to master: test, version it, publish the image and the Android app.
# S13 picks the new image up by itself (Watchtower, see deploy/s13/compose.yaml).
name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: version
        run: echo "version=$(python3 src/auto_pid_tuning/version.py)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Tag
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |  # a re-run of the same commit already has its tag
          git ls-remote --exit-code --tags origin "$TAG" || {
            git tag "$TAG" && git push origin "$TAG"
          }

      - name: Android app
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          ANDROID_KEYSTORE: ${{ runner.temp }}/auto-pid-tuning.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE"
          sh android/build.sh
          rm "$ANDROID_KEYSTORE"

      # The home F-Droid store (magasin-fdroid on S13) picks the APK up from this release.
      # Its notes, the merged PR's title, become the version notes in F-Droid.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 && exit 0  # a re-run: already published
          notes=$(git log -1 --format=%b | grep -v -E '^(Co-Authored-By:|🤖)' || true)
          gh release create "$TAG" android/build/*.apk --verify-tag --title "$TAG" --notes "${notes:-$TAG}"

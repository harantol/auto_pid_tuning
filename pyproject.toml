[project]
name = "auto-pid-tuning"
version = "0.1.0"
description = "Betaflight auto-tuning of PIDs, filters and rates from a blackbox log and a flight style"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "orangebox>=0.5.0",
]

[project.scripts]
auto-pid-tuning = "auto_pid_tuning.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_pid_tuning"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["auto_pid_tuning", "conftest", "simulate"]

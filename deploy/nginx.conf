# The web app: static files only (see Dockerfile).
server {
    listen 7860;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        # Browsers check for a newer version on every visit, so a release shows at once.
        add_header Cache-Control "no-cache";
    }
}
